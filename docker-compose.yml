services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    profiles: [infra, core, full]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    profiles: [infra, core, full]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      retries: 8

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    profiles: [infra, core, full]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 15s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    profiles: [infra, core, full]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.raw --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.alerts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.dlq --partitions 1 --replication-factor 1
        echo topics ready

  minio:
    build:
      context: .
      dockerfile: docker/Dockerfile.minio
    profiles: [storage]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-momoshield}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-momoshield_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      retries: 5

  postgres:
    image: postgres:16-alpine
    profiles: [infra, core, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-momoshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momoshield_dev}
      POSTGRES_DB: ${POSTGRES_DB:-momoshield}
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/sql/002_staging_extend.sql:/docker-entrypoint-initdb.d/02-staging.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momoshield"]
      interval: 10s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    profiles: [apps, core, full]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_RAW: transactions.raw
      KAFKA_TOPIC_DLQ: transactions.dlq
      PRODUCER_RATE: ${PRODUCER_RATE:-100}
      PRODUCER_MODE: hybrid
      # Résolution auto dans le conteneur (plus gros *.csv sous data/paysim)
    volumes:
      - ./data/paysim:/app/data/paysim:ro
      - ./data/momtsim:/app/data/momtsim:ro
      - ./tests/data:/app/tests/data:ro

  streaming-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    profiles: [apps, core, full]
    command: ["python", "-m", "streaming.python_consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_RAW: transactions.raw
      KAFKA_TOPIC_ALERTS: transactions.alerts
      BRONZE_DIR: /data/bronze
    volumes:
      - bronze_data:/data/bronze
      - ./streaming:/app/streaming
      - ./momoshield:/app/momoshield
      - ./config:/app/config

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    profiles: [apps, core, full]
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://momoshield:momoshield_dev@postgres:5432/momoshield

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    profiles: [full]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    profiles: [full]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname MoMoShield \
          --role Admin --email admin@momoshield.local || true
        for dag in $$(airflow dags list -o plain 2>/dev/null | tail -n +2 | awk '{print $$1}'); do
          airflow dags unpause "$$dag" 2>/dev/null || true
        done
        echo "airflow init ok"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://momoshield:momoshield_dev@postgres:5432/momoshield
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKmu6FuSU3kyaRnhCZq5j7SspN5AM5iZJlm8vuhG0=}
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://momoshield:momoshield_dev@postgres:5432/momoshield
      BRONZE_DIR: /data/bronze
      PYTHONPATH: /opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./momoshield:/opt/airflow/momoshield
      - ./data/bronze:/data/bronze
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    profiles: [full]
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8088}:8080"
    environment:
      <<: *airflow_env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./momoshield:/opt/airflow/momoshield
      - ./data/bronze:/data/bronze
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    profiles: [full]
    command: scheduler
    environment:
      <<: *airflow_env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./momoshield:/opt/airflow/momoshield
      - ./data/bronze:/data/bronze
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  ci:
    build:
      context: .
      dockerfile: docker/Dockerfile.ci
    profiles: [ci]
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  minio_data:
  pg_data:
  bronze_data: