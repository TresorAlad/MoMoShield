[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momoshield"
version = "1.0.0"
description = "Détection de fraude Mobile Money — pipeline data"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "faker>=24.0",
    "confluent-kafka>=2.3",
    "pandas>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
producer = ["confluent-kafka[avro]>=2.3", "fastavro>=1.9"]
kaggle = ["kaggle>=1.6", "six>=1.16"]
streamlit = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "altair>=5.0",
    "folium>=0.15",
    "streamlit-folium>=0.20",
]
airflow = ["apache-airflow>=2.8.0"]
dbt = ["dbt-core>=1.7", "dbt-postgres>=1.7"]
ge = ["great-expectations>=0.18"]

[tool.setuptools.packages.find]
where = ["."]
include = ["momoshield*", "producer*", "streaming*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests nécessitant Docker",
    "integration: tests d'intégration",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["streaming/rules", "momoshield"]

[tool.coverage.report]
fail_under = 70
include = ["streaming/rules/*"]